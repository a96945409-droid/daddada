<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* 作品一覧：夜の二作品を並べる入口。ゲームと同じ、夜の単一テーマ。 */
:root{--bg:#0b1215;--panel:#141d21;--panel-2:#1b262b;--line:#2b3a40;--text:#e9e3d3;--muted:#98a59f;--brass:#c9a24e;--brass-hi:#e7c97f;
 --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;--f-ui:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1215}}
:root[data-theme="dark"]{--bg:#0b1215}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-ui);line-height:1.6;-webkit-tap-highlight-color:transparent;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:980px;margin:0 auto;padding-block:28px 32px}
.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--brass-hi);margin:0 0 6px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(36px,9vw,60px);letter-spacing:.18em;margin:0 0 8px;line-height:1.15}
.lead{font-family:var(--f-display);font-size:clamp(14px,3.8vw,16px);line-height:1.9;color:#dcd5c4;margin:0 0 22px;max-width:36em}
.works{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:720px){.works{grid-template-columns:1fr 1fr;gap:18px}}
.work{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:inherit;text-decoration:none;transition:border-color .2s,transform .2s}
.work:hover{border-color:#7d6430;transform:translateY(-2px)}
.work:focus-visible{outline:2px solid var(--brass-hi);outline-offset:3px}
.art{position:relative;height:clamp(118px,26vw,190px);overflow:hidden;background:#05080a}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.no{font-size:12px;letter-spacing:.2em;color:var(--brass-hi)}
.ttl{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,6.4vw,30px);letter-spacing:.12em;line-height:1.2}
.syn{font-size:14px;color:#cfc8b8;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:12px;border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:2px 10px;color:#d8d0bd}
.status{font-family:var(--f-mono);font-size:13px;color:var(--brass-hi);margin-top:2px;min-height:1.4em}
.go{margin-top:8px;align-self:flex-start;font-family:var(--f-display);font-size:15px;letter-spacing:.14em;color:var(--brass-hi);border:1px solid #7d6430;background:linear-gradient(#3b3120,#2a2317);border-radius:8px;padding:9px 18px}
footer{margin-top:22px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:12px}
.lh-beam{transform-box:fill-box;transform-origin:100% 50%;animation:sweep 7s linear infinite}
@keyframes sweep{0%{transform:rotate(-16deg);opacity:0}12%{opacity:.95}40%{transform:rotate(20deg);opacity:0}100%{transform:rotate(20deg);opacity:0}}
.rain{animation:rain .42s linear infinite}@keyframes rain{from{transform:translate(4px,-28px)}to{transform:translate(-5px,0)}}
.sfall{animation:sfall 7s linear infinite}@keyframes sfall{from{transform:translate(0,-420px)}to{transform:translate(-40px,0)}}
@media (prefers-reduced-motion:reduce){.lh-beam,.rain,.sfall{animation:none}}
</style>
</head>

<script>
(function(){const fmt=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0')};
 document.querySelectorAll('.work').forEach(w=>{let txt='未クリア';try{const b=JSON.parse(localStorage.getItem(w.dataset.best)||'null');if(b&&b.t)txt=`最速 ${fmt(b.t)}　ヒント ${b.h}回`;
  const sv=JSON.parse(localStorage.getItem(w.dataset.save)||'null');if(sv&&String(sv.v)===w.dataset.ver&&sv.started&&!sv.done){txt+=`　／　つづきあり（${fmt(sv.elapsed||0)}）`;w.querySelector('.go').textContent='つづきから'}}catch(e){}
  w.querySelector('.status').textContent=txt})})();
</script>
